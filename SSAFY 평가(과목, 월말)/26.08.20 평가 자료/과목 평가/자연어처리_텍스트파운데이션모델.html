<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자연어 처리 &amp; 텍스트파운데이션모델</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #10b981;
            --success-bg: #ecfdf5;
            --error-color: #ef4444;
            --error-bg: #fef2f2;
            --warning-color: #f59e0b;
            --warning-bg: #fffbebf;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Screen Switcher */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Start Screen */
        .start-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 40px 24px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .mode-selection {
            display: flex;
            gap: 20px;
            margin-top: 32px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 250px;
            max-width: 350px;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .mode-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .mode-btn h3 {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-btn p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Status & Progress Bar */
        .progress-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .progress-bar-bg {
            background: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar-fill {
            background: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-tracker {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-tracker span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Question Navigation Grid */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .nav-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            border-color: var(--primary-color);
        }

        .nav-item.current {
            border-color: var(--primary-color);
            font-weight: 800;
            outline: 2px solid var(--primary-color);
        }

        .nav-item.unanswered { background: #f8fafc; color: var(--text-secondary); }
        .nav-item.correct { background: var(--success-color); color: #fff; border-color: var(--success-color); }
        .nav-item.incorrect { background: var(--error-color); color: #fff; border-color: var(--error-color); }
        .nav-item.revealed { background: var(--warning-color); color: #fff; border-color: var(--warning-color); }

        /* Main Question Card */
        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .question-number {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-color);
            background: #eff6ff;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 24px;
            color: var(--text-primary);
            white-space: pre-line;
        }

        /* Options */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-card {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            position: relative;
        }

        .option-card:hover {
            border-color: var(--primary-color);
            background: #f8fafc;
        }

        .option-card.selected {
            border-color: var(--primary-color);
            background: #eff6ff;
        }

        .option-card input[type="radio"] {
            margin-right: 14px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .option-text {
            font-size: 0.95rem;
            line-height: 1.4;
            flex: 1;
        }

        .option-badge {
            font-size: 0.85rem;
            font-weight: 700;
            margin-left: 10px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .option-card.correct-opt {
            border-color: var(--success-color);
            background: var(--success-bg);
        }
        .option-card.correct-opt .option-badge {
            color: var(--success-color);
        }

        .option-card.incorrect-opt {
            border-color: var(--error-color);
            background: var(--error-bg);
        }
        .option-card.incorrect-opt .option-badge {
            color: var(--error-color);
        }

        /* Controls */
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary-color); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary { background: #f1f5f9; color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #e2e8f0; }

        .btn-warning { background: var(--warning-color); color: #fff; }
        .btn-warning:hover { filter: brightness(0.9); }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Feedback Area */
        .feedback-area {
            margin-top: 20px;
            padding: 20px;
            border-radius: var(--radius-md);
            display: none;
        }

        .feedback-area.active {
            display: block;
        }

        .feedback-area.correct-fb {
            background: var(--success-bg);
            border: 1px solid var(--success-color);
            color: #065f46;
        }

        .feedback-area.incorrect-fb {
            background: var(--error-bg);
            border: 1px solid var(--error-color);
            color: #991b1b;
        }

        .feedback-area.revealed-fb {
            background: var(--warning-bg);
            border: 1px solid var(--warning-color);
            color: #92400e;
        }

        .feedback-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* Explanation Details */
        .explanation-card {
            margin-top: 20px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            display: none;
        }

        .explanation-card.active {
            display: block;
        }

        .exp-section {
            margin-bottom: 16px;
        }

        .exp-section:last-child {
            margin-bottom: 0;
        }

        .exp-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .exp-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-line;
        }

        /* Navigation Controls */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        /* Result Screen */
        .result-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 40px 28px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #eff6ff;
            border: 6px solid var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }

        .score-val {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-color);
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .result-stats {
            display: flex;
            justify-content: space-around;
            margin: 24px 0;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .stat-item h4 {
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        .stat-item p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .result-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 12px 8px;
            }
            .question-card {
                padding: 18px;
            }
            .mode-selection {
                flex-direction: column;
            }
            .nav-grid {
                grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
                gap: 6px;
                padding: 10px;
            }
            .nav-controls {
                flex-direction: column;
                gap: 10px;
            }
            .nav-controls .btn {
                width: 100%;
            }
            .action-buttons {
                flex-direction: column;
            }
            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>자연어 처리 &amp; 텍스트 파운데이션 모델</h1>
        <p>고내강 최고</p>
    </header>

    <!-- 1. START SCREEN -->
    <div id="start-screen" class="screen active">
        <div class="start-card">
            <h2>학습 모드를 선택하세요</h2>
            <p style="margin-top: 8px; color: var(--text-secondary);">강의자료 핵심 문제 (총 34문항) 기반 맞춤 풀이</p>

            <div class="mode-selection">
                <button class="mode-btn" onclick="startApp('study')">
                    <h3>📚 학습 모드</h3>
                    <p>개념을 하나씩 확인하며 학습합니다.<br>즉시 채점, 정답 확인, 상세 해설을 자유롭게 이용할 수 있습니다.</p>
                </button>
                <button class="mode-btn" onclick="startApp('exam')">
                    <h3>📝 시험 모드</h3>
                    <p>실제 시험처럼 풀이합니다.<br>정답과 해설은 숨겨지며, 모든 문제를 푼 뒤 최종 성적표를 확인합니다.</p>
                </button>
            </div>
        </div>
    </div>

    <!-- 2. QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <!-- Progress Bar & Status -->
        <div class="progress-card">
            <div class="progress-header">
                <span id="progress-text">문제 1 / 34</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
            <div class="status-tracker">
                <span>🟢 정답: <strong id="count-correct">0</strong></span>
                <span>🔴 오답: <strong id="count-incorrect">0</strong></span>
                <span>🟡 확인: <strong id="count-revealed">0</strong></span>
                <span>⚪ 미풀이: <strong id="count-unanswered">34</strong></span>
            </div>
        </div>

        <!-- Question Navigation Grid -->
        <div id="nav-grid" class="nav-grid"></div>

        <!-- Question Main Card -->
        <div class="question-card">
            <div class="question-header">
                <span id="q-number" class="question-number">문제 01</span>
                <span id="mode-badge" style="font-size:0.85rem; color:var(--text-secondary); font-weight:600;">학습 모드</span>
            </div>

            <div id="q-text" class="question-text"></div>

            <div id="options-container" class="options-list"></div>

            <div class="action-buttons">
                <button id="btn-submit" class="btn btn-primary" onclick="submitAnswer()">제출하기</button>
                <button id="btn-show-ans" class="btn btn-warning" onclick="revealAnswer()">정답 보기</button>
                <button id="btn-show-exp" class="btn btn-secondary" onclick="toggleExplanation()">해설 보기</button>
            </div>

            <!-- Feedback Box -->
            <div id="feedback-area" class="feedback-area"></div>

            <!-- Detailed Explanation Box -->
            <div id="explanation-card" class="explanation-card">
                <div class="exp-section">
                    <div class="exp-label">[정답]</div>
                    <div id="exp-correct" class="exp-content"></div>
                </div>
                <div class="exp-section">
                    <div class="exp-label">[핵심 개념]</div>
                    <div id="exp-concept" class="exp-content"></div>
                </div>
                <div class="exp-section">
                    <div class="exp-label">[풀이]</div>
                    <div id="exp-detail" class="exp-content"></div>
                </div>
                <div class="exp-section">
                    <div class="exp-label">[왜 이 답인가?]</div>
                    <div id="exp-why" class="exp-content"></div>
                </div>
                <div class="exp-section">
                    <div class="exp-label">[시험 포인트]</div>
                    <div id="exp-point" class="exp-content"></div>
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="nav-controls">
            <button id="btn-prev" class="btn btn-secondary" onclick="prevQuestion()">← 이전 문제</button>
            <button id="btn-finish-exam" class="btn btn-warning" style="display:none;" onclick="finishQuiz()">시험 종료 및 제출</button>
            <button id="btn-next" class="btn btn-secondary" onclick="nextQuestion()">다음 문제 →</button>
        </div>
    </div>

    <!-- 3. RESULT SCREEN -->
    <div id="result-screen" class="screen">
        <div class="result-card">
            <h2>🎉 시험 및 학습 완료!</h2>
            <p style="color: var(--text-secondary); margin-top: 6px;">수고하셨습니다. 결과 분석 및 복습을 진행하세요.</p>

            <div style="margin-top: 24px;">
                <div class="score-circle">
                    <span id="final-score" class="score-val">0점</span>
                    <span id="final-rate" class="score-label">정답률 0%</span>
                </div>
            </div>

            <div class="result-stats">
                <div class="stat-item">
                    <h4 id="res-total">34</h4>
                    <p>총 문제 수</p>
                </div>
                <div class="stat-item">
                    <h4 id="res-correct" style="color: var(--success-color);">0</h4>
                    <p>정답</p>
                </div>
                <div class="stat-item">
                    <h4 id="res-incorrect" style="color: var(--error-color);">0</h4>
                    <p>오답</p>
                </div>
                <div class="stat-item">
                    <h4 id="res-revealed" style="color: var(--warning-color);">0</h4>
                    <p>정답 확인</p>
                </div>
                <div class="stat-item">
                    <h4 id="res-unanswered" style="color: var(--text-secondary);">0</h4>
                    <p>미풀이</p>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn btn-primary" onclick="restartQuiz('all')">🔄 처음부터 다시 풀기</button>
                <button id="btn-retry-wrong" class="btn btn-secondary" onclick="restartQuiz('incorrect')">❌ 틀린 문제 다시 풀기</button>
                <button class="btn btn-secondary" onclick="switchMode('study')">📖 전체 문제 복습 (학습 모드)</button>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. DATA DEFINITIONS (34 Complete Questions)
// Pure Text Formulas, No $ symbols.
// ==========================================
const questions = [
    {
        id: 1,
        question: "One-hot Representation(원-핫 인코딩)에 대한 설명으로 옳지 않은 것을 고르시오.",
        options: [
            "1. 차원이 매우 커져 계산량이 증가한다.",
            "2. 단어 간의 유사도는 항상 1이 나온다.",
            "3. 대부분의 값이 0으로 채워져 메모리 효율이 낮다.",
            "4. \"Dog\" - \"Puppy\"의 거리와 \"Dog\" - \"Computer\"의 거리는 같다."
        ],
        answer: 1, // Index 1 -> Option 2
        concept: "원-핫 인코딩(One-hot Encoding)과 희소 벡터(Sparse Vector)의 직교성",
        detail: "원-핫 인코딩은 단어 집합의 크기만큼 차원을 가지며 한 원소만 1이고 나머지는 0인 벡터 표현법입니다.",
        why: "원-핫 인코딩에서는 서로 다른 두 단어 벡터가 항상 서로 직교(Orthogonal)하므로 내적(Dot Product) 값이 항상 0이 됩니다. 따라서 단어 간의 유사도는 항상 0이 되며 의미적 유사성을 반영하지 못합니다.",
        examPoint: "원-핫 벡터 간 내적 = 0, 유사도 = 0, 의미적 유사성 표현 불가, 차원의 저주 발생."
    },
    {
        id: 2,
        question: "CBOW와 Skip-gram의 차이점에 대한 설명으로 옳은 것을 고르시오.",
        options: [
            "1. CBOW는 Skip-gram보다 적게 등장하는 단어에 대해 더 높은 정확도를 보인다.",
            "2. CBOW는 Skip-gram보다 학습이 빠르고, 빈도가 높은 단어에서 성능이 좋다.",
            "3. Skip-gram은 학습 속도는 빠르지만 드물게 등장하는 단어에 약하다.",
            "4. Skip-gram은 한번에 여러 단어를 예측한다."
        ],
        answer: 1, // Index 1 -> Option 2

// ==========================================
// 2. STATE MANAGEMENT
// ==========================================
let currentMode = 'study'; // 'study' or 'exam'
let currentIndex = 0;
let userAnswers = {}; // { questionId: selectedOptionIndex }
let userStates = {};  // { questionId: 'unanswered' | 'correct' | 'incorrect' | 'revealed' }
let activeQuestionSet = [...questions]; // Array of active question objects

// Initialize state store
function initState() {
    userAnswers = {};
    userStates = {};
    questions.forEach(q => {
        userStates[q.id] = 'unanswered';
    });
}

// ==========================================
// 3. CORE APP LOGIC
// ==========================================
function startApp(mode) {
    currentMode = mode;
    activeQuestionSet = [...questions];
    initState();
    currentIndex = 0;

    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('result-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');

    document.getElementById('mode-badge').innerText = mode === 'study' ? '📚 학습 모드' : '📝 시험 모드';

    // Adjust button visibility based on mode
    if (mode === 'exam') {
        document.getElementById('btn-show-ans').style.display = 'none';
        document.getElementById('btn-show-exp').style.display = 'none';
        document.getElementById('btn-finish-exam').style.display = 'inline-flex';
    } else {
        document.getElementById('btn-show-ans').style.display = 'inline-flex';
        document.getElementById('btn-show-exp').style.display = 'inline-flex';
        document.getElementById('btn-finish-exam').style.display = 'none';
    }

    renderNavGrid();
    renderQuestion();
}

function switchMode(mode) {
    startApp(mode);
}

function renderNavGrid() {
    const grid = document.getElementById('nav-grid');
    grid.innerHTML = '';

    activeQuestionSet.forEach((q, idx) => {
        const item = document.createElement('div');
        const state = userStates[q.id] || 'unanswered';
        item.className = `nav-item ${state} ${idx === currentIndex ? 'current' : ''}`;
        item.innerText = idx + 1;
        item.onclick = () => jumpToQuestion(idx);
        grid.appendChild(item);
    });

    updateProgress();
}

function updateProgress() {
    const total = activeQuestionSet.length;
    let correct = 0, incorrect = 0, revealed = 0, unanswered = 0;

    activeQuestionSet.forEach(q => {
        const st = userStates[q.id];
        if (st === 'correct') correct++;
        else if (st === 'incorrect') incorrect++;
        else if (st === 'revealed') revealed++;
        else unanswered++;
    });

    const answeredCount = total - unanswered;
    const pct = Math.round((answeredCount / total) * 100);

    document.getElementById('progress-text').innerText = `문제 ${currentIndex + 1} / ${total}`;
    document.getElementById('progress-percent').innerText = `${pct}%`;
    document.getElementById('progress-fill').style.width = `${pct}%`;

    document.getElementById('count-correct').innerText = correct;
    document.getElementById('count-incorrect').innerText = incorrect;
    document.getElementById('count-revealed').innerText = revealed;
    document.getElementById('count-unanswered').innerText = unanswered;
}

function renderQuestion() {
    const q = activeQuestionSet[currentIndex];
    const qState = userStates[q.id];
    const selectedOpt = userAnswers[q.id];

    document.getElementById('q-number').innerText = `문제 ${String(currentIndex + 1).padStart(2, '0')}`;
    document.getElementById('q-text').innerText = q.question;

    const optContainer = document.getElementById('options-container');
    optContainer.innerHTML = '';

    q.options.forEach((optText, optIdx) => {
        const optCard = document.createElement('label');
        let cardClass = 'option-card';

        if (selectedOpt === optIdx) {
            cardClass += ' selected';
        }

        // Show feedback style if answered/revealed in Study Mode
        if (currentMode === 'study' && (qState === 'correct' || qState === 'incorrect' || qState === 'revealed')) {
            if (optIdx === q.answer) {
                cardClass += ' correct-opt';
            } else if (selectedOpt === optIdx && optIdx !== q.answer) {
                cardClass += ' incorrect-opt';
            }
        }

        optCard.className = cardClass;

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'quiz-option';
        radio.value = optIdx;
        radio.checked = selectedOpt === optIdx;
        radio.onchange = () => selectOption(optIdx);

        if (currentMode === 'study' && (qState === 'correct' || qState === 'incorrect' || qState === 'revealed')) {
            radio.disabled = true;
        }

        const spanText = document.createElement('span');
        spanText.className = 'option-text';
        spanText.innerText = optText;

        optCard.appendChild(radio);
        optCard.appendChild(spanText);

        // Badges in study mode
        if (currentMode === 'study' && (qState === 'correct' || qState === 'incorrect' || qState === 'revealed')) {
            if (optIdx === q.answer) {
                const badge = document.createElement('span');
                badge.className = 'option-badge';
                badge.innerText = '✓ 정답';
                optCard.appendChild(badge);
            } else if (selectedOpt === optIdx && optIdx !== q.answer) {
                const badge = document.createElement('span');
                badge.className = 'option-badge';
                badge.innerText = '✗ 내가 선택한 답';
                optCard.appendChild(badge);
            }
        }

        optContainer.appendChild(optCard);
    });

    // Reset feedback & explanation panels
    const fbArea = document.getElementById('feedback-area');
    const expCard = document.getElementById('explanation-card');
    fbArea.className = 'feedback-area';
    fbArea.innerHTML = '';
    expCard.classList.remove('active');

    // Restore feedback state if already answered in study mode
    if (currentMode === 'study') {
        if (qState === 'correct') {
            showFeedback(true, selectedOpt, q.answer, q);
            showExplanation(q);
        } else if (qState === 'incorrect') {
            showFeedback(false, selectedOpt, q.answer, q);
            showExplanation(q);
        } else if (qState === 'revealed') {
            showRevealedFeedback(q);
            showExplanation(q);
        }
    }

    // Button states
    document.getElementById('btn-prev').disabled = currentIndex === 0;
    document.getElementById('btn-next').disabled = currentIndex === activeQuestionSet.length - 1;

    renderNavGrid();
}

function selectOption(optIdx) {
    const q = activeQuestionSet[currentIndex];
    if (currentMode === 'study' && userStates[q.id] !== 'unanswered') return;

    userAnswers[q.id] = optIdx;
    renderQuestion();
}

function submitAnswer() {
    const q = activeQuestionSet[currentIndex];
    const selected = userAnswers[q.id];

    if (selected === undefined) {
        alert('답안을 선택해주세요!');
        return;
    }

    if (selected === q.answer) {
        userStates[q.id] = 'correct';
    } else {
        userStates[q.id] = 'incorrect';
    }

    renderQuestion();
}

function revealAnswer() {
    const q = activeQuestionSet[currentIndex];
    userStates[q.id] = 'revealed';
    renderQuestion();
}

function showFeedback(isCorrect, userOpt, correctOpt, q) {
    const fbArea = document.getElementById('feedback-area');
    fbArea.className = `feedback-area active ${isCorrect ? 'correct-fb' : 'incorrect-fb'}`;

    if (isCorrect) {
        fbArea.innerHTML = `
            <div class="feedback-title">🎉 정답입니다!</div>
            <div>• 선택한 답: ${q.options[userOpt]}</div>
            <div>• 정답: ${q.options[correctOpt]}</div>
        `;
    } else {
        fbArea.innerHTML = `
            <div class="feedback-title">❌ 오답입니다.</div>
            <div>• 내가 선택한 답: ${q.options[userOpt]}</div>
            <div>• 올바른 정답: ${q.options[correctOpt]}</div>
            <div style="margin-top: 8px;">• <strong>핵심 개념:</strong> ${q.concept}</div>
        `;
    }
}

function showRevealedFeedback(q) {
    const fbArea = document.getElementById('feedback-area');
    fbArea.className = 'feedback-area active revealed-fb';
    fbArea.innerHTML = `
        <div class="feedback-title">🟡 정답 확인 상태</div>
        <div>• 정답: <strong>${q.options[q.answer]}</strong></div>
        <div style="margin-top:4px;">• 핵심 개념: ${q.concept}</div>
    `;
}

function toggleExplanation() {
    const expCard = document.getElementById('explanation-card');
    const q = activeQuestionSet[currentIndex];
    if (expCard.classList.contains('active')) {
        expCard.classList.remove('active');
    } else {
        showExplanation(q);
    }
}

function showExplanation(q) {
    const expCard = document.getElementById('explanation-card');
    document.getElementById('exp-correct').innerText = `${q.answer + 1}번 - ${q.options[q.answer]}`;
    document.getElementById('exp-concept').innerText = q.concept;
    document.getElementById('exp-detail').innerText = q.detail;
    document.getElementById('exp-why').innerText = q.why;
    document.getElementById('exp-point').innerText = q.examPoint;
    expCard.classList.add('active');
}

function nextQuestion() {
    if (currentIndex < activeQuestionSet.length - 1) {
        currentIndex++;
        renderQuestion();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function jumpToQuestion(idx) {
    currentIndex = idx;
    renderQuestion();
}

function finishQuiz() {
    const total = activeQuestionSet.length;
    let correct = 0, incorrect = 0, revealed = 0, unanswered = 0;

    activeQuestionSet.forEach(q => {
        const st = userStates[q.id];
        if (st === 'correct') correct++;
        else if (st === 'incorrect') incorrect++;
        else if (st === 'revealed') revealed++;
        else unanswered++;
    });

    const score = Math.round((correct / total) * 100);

    document.getElementById('quiz-screen').classList.remove('active');
    document.getElementById('result-screen').classList.add('active');

    document.getElementById('final-score').innerText = `${score}점`;
    document.getElementById('final-rate').innerText = `정답률 ${score}%`;
    document.getElementById('res-total').innerText = total;
    document.getElementById('res-correct').innerText = correct;
    document.getElementById('res-incorrect').innerText = incorrect;
    document.getElementById('res-revealed').innerText = revealed;
    document.getElementById('res-unanswered').innerText = unanswered;

    const btnRetryWrong = document.getElementById('btn-retry-wrong');
    if (incorrect === 0) {
        btnRetryWrong.style.display = 'none';
    } else {
        btnRetryWrong.style.display = 'inline-flex';
    }
}

function restartQuiz(type) {
    if (type === 'all') {
        startApp(currentMode);
    } else if (type === 'incorrect') {
        const wrongQs = questions.filter(q => userStates[q.id] === 'incorrect');
        if (wrongQs.length === 0) {
            alert('틀린 문제가 없습니다!');
            return;
        }
        activeQuestionSet = wrongQs;
        initState();
        currentIndex = 0;

        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');

        renderNavGrid();
        renderQuestion();
    }
}

// Double Check Verification on Load
window.onload = function() {
    console.log(`[시스템 검수 완료] 총 ${questions.length}개 문제 정상 로드됨.`);
};
