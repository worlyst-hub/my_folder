<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & 기계학습 시험 대비 대시보드</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen */
        .start-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .mode-btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            padding: 24px;
            width: 280px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .mode-btn:hover {
            background: #f0fdf4;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .mode-btn h3 {
            color: var(--primary);
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .mode-btn p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Top Progress Bar & Stats */
        .dashboard-header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .stat-box {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
        }

        .stat-box .label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat-box .value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Navigation Matrix */
        .nav-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        .nav-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .nav-item.active {
            border-color: var(--primary);
            border-width: 2px;
        }

        .nav-item.unanswered { background: #f8fafc; color: var(--text-muted); }
        .nav-item.correct { background: #d1fae5; color: #065f46; border-color: #10b981; }
        .nav-item.incorrect { background: #fee2e2; color: #991b1b; border-color: #ef4444; }
        .nav-item.revealed { background: #fef3c7; color: #92400e; border-color: #f59e0b; }

        /* Question Card */
        .question-card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .option-item:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-item input[type="radio"] {
            margin-right: 14px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .option-item.correct-bg {
            background: #ecfdf5 !important;
            border-color: var(--success) !important;
            color: #065f46;
            font-weight: bold;
        }

        .option-item.incorrect-bg {
            background: #fef2f2 !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }

        .feedback-badge {
            margin-left: auto;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: var(--text-main); }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-info { background: var(--info); color: white; }
        .btn-info:hover { background: #2563eb; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Explanation Box */
        .explanation-box {
            display: none;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-section {
            margin-bottom: 14px;
        }

        .explanation-section:last-child {
            margin-bottom: 0;
        }

        .explanation-title-tag {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 4px;
            display: block;
        }

        /* Result Screen */
        .result-card {
            background: var(--card-bg);
            padding: 36px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .result-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 16px 0;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .question-card { padding: 18px; }
            .mode-btn { width: 100%; }
            .btn { width: 100%; margin-bottom: 4px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI & 기계학습 시험 대비 대시보드</h1>
    </header>

    <!-- 1. Start Screen -->
    <div id="start-screen" class="screen active">
        <div class="start-card">
            <h2>학습 모드를 선택하세요</h2>
            <p style="color: var(--text-muted); margin-top: 8px;">강의자료 기반 34문항 완벽 대비 인터랙티브 시스템</p>
            <div class="mode-btn-group">
                <button class="mode-btn" onclick="startApp('study')">
                    <h3>📚 학습 모드</h3>
                    <p>개념을 공부하며 문제를 푸는 모드입니다.<br>즉시 채점, 정답 및 상세 해설 보기가 가능합니다.</p>
                </button>
                <button class="mode-btn" onclick="startApp('exam')">
                    <h3>📝 시험 모드</h3>
                    <p>실제 시험처럼 제한된 환경에서 풀이합니다.<br>모든 문제를 제출한 후 최종 결과를 확인합니다.</p>
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Main Quiz Screen -->
    <div id="quiz-screen" class="screen">
        <!-- Top Stats Bar -->
        <div class="dashboard-header">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="label">문제 번호</div>
                    <div class="value" id="stat-current">1 / 34</div>
                </div>
                <div class="stat-box">
                    <div class="label">진행률</div>
                    <div class="value" id="stat-progress">0%</div>
                </div>
                <div class="stat-box">
                    <div class="label">정답</div>
                    <div class="value" id="stat-correct" style="color: var(--success);">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">오답</div>
                    <div class="value" id="stat-incorrect" style="color: var(--danger);">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">미풀이</div>
                    <div class="value" id="stat-unanswered">34</div>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- Navigation Matrix -->
        <div class="nav-matrix" id="nav-matrix"></div>

        <!-- Question Card -->
        <div class="question-card">
            <div class="question-title" id="q-title"></div>
            <ul class="options-list" id="q-options"></ul>

            <!-- Action Buttons -->
            <div class="btn-group">
                <button class="btn btn-primary" id="btn-submit" onclick="submitAnswer()">제출하기</button>
                <button class="btn btn-warning" id="btn-reveal" onclick="revealAnswer()">정답 보기</button>
                <button class="btn btn-info" id="btn-explain" onclick="toggleExplanation()">해설 보기</button>
            </div>

            <!-- Feedback Message -->
            <div id="feedback-message" style="font-weight: bold; font-size: 1.1rem; margin-top: 10px; display: none;"></div>

            <!-- Explanation Box -->
            <div class="explanation-box" id="explanation-box">
                <div class="explanation-section">
                    <span class="explanation-title-tag">[정답]</span>
                    <div id="exp-answer"></div>
                </div>
                <div class="explanation-section">
                    <span class="explanation-title-tag">[핵심 개념]</span>
                    <div id="exp-concept"></div>
                </div>
                <div class="explanation-section">
                    <span class="explanation-title-tag">[풀이]</span>
                    <div id="exp-solution"></div>
                </div>
                <div class="explanation-section">
                    <span class="explanation-title-tag">[왜 이 답인가?]</span>
                    <div id="exp-why"></div>
                </div>
                <div class="explanation-section">
                    <span class="explanation-title-tag">[시험 포인트]</span>
                    <div id="exp-point"></div>
                </div>
                <div class="explanation-section" id="exp-wrong-container">
                    <span class="explanation-title-tag">[오답 포인트]</span>
                    <div id="exp-wrong"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div style="display: flex; justify-content: space-between;">
            <button class="btn btn-secondary" id="btn-prev" onclick="prevQuestion()">← 이전 문제</button>
            <button class="btn btn-secondary" id="btn-next" onclick="nextQuestion()">다음 문제 →</button>
        </div>
    </div>

    <!-- 3. Result Screen -->
    <div id="result-screen" class="screen">
        <div class="result-card">
            <h2>최종 시험 결과</h2>
            <div class="result-score" id="res-score">0점</div>
            <div class="result-stats">
                <div>정답률: <strong id="res-rate">0%</strong></div>
                <div>정답: <strong id="res-correct" style="color: var(--success);">0</strong></div>
                <div>오답: <strong id="res-incorrect" style="color: var(--danger);">0</strong></div>
                <div>미풀이: <strong id="res-unanswered" style="color: var(--text-muted);">0</strong></div>
            </div>
            <div class="btn-group" style="justify-content: center;">
                <button class="btn btn-primary" onclick="restartApp('all')">🔄 처음부터 다시 풀기</button>
                <button class="btn btn-warning" onclick="restartApp('wrong')">❌ 틀린 문제 다시 풀기</button>
                <button class="btn btn-info" onclick="switchToReview()">📖 전체 문제 복습</button>
            </div>
        </div>
    </div>
</div>

<script>
// 데이터 구조 검증 및 34개 전수 데이터 포함
const questionsData = [
    {
        id: 1,
        question: "Q1. AI, ML, DL의 관계에 대한 설명으로 옳은 것은?[cite: 1, 3]",
        options: [
            "ML은 AI와 DL의 상위 개념이다.[cite: 1]",
            "AI는 반드시 ML을 사용해야 한다.[cite: 1]",
            "ML은 AI의 한 부분으로, 데이터로부터 학습을 수행한다.[cite: 1]",
            "규칙 기반 시스템은 ML의 한 분야이다.[cite: 1]",
            "ML은 사람이 직접 코딩한 규칙을 그대로 사용하는 방식이다.[cite: 1]"
        ],
        answer: 2,
        concept: "AI(인공지능)는 인지·학습·추론을 수행하는 전체 시스템이며, ML(머신러닝)은 데이터로부터 학습하여 목표를 달성하는 하위 방법론이고, DL(딥러닝)은 ML의 한 종류이다[cite: 1, 3].",
        solution: "ML은 데이터로부터 규칙을 학습해 목표 달성을 돕는 AI의 한 분야이다[cite: 1]. 규칙 기반 시스템은 코딩된 규칙을 사용하므로 ML이 아니며, AI는 명시적 규칙 기반으로도 구현 가능하다[cite: 1].",
        why: "보기 ③번이 AI ⊃ ML ⊃ DL의 올바른 포함 관계 및 정의를 정확히 설명하고 있다[cite: 1, 3].",
        examPoint: "AI와 ML, DL의 포함 관계 (DL ⊂ ML ⊂ AI) 및 규칙 기반 시스템과 ML의 차이점을 명확히 구분할 것[cite: 1].",
        wrongPoints: "① ML은 AI의 하위 개념[cite: 1]. ② AI는 규칙 기반으로도 가능[cite: 1]. ④ 규칙 기반은 AI의 예시이지 ML이 아님[cite: 1]. ⑤ 사람이 직접 코딩하는 것은 전통적 프로그래밍/규칙 기반임[cite: 1, 3]."
    },
    {
        id: 2,
        question: "Q2. Feature와 Label에 대한 설명으로 옳지 않은 것은?[cite: 1]",
        options: [
            "Feature는 모델이 예측에 사용하는 입력 정보이다.[cite: 1]",
            "Label은 모델이 예측하려는 정답, 즉 학습의 목표이다.[cite: 1]",
            "Feature와 Label의 분포와 관계가 학습 결과를 결정한다.[cite: 1]",
            "Feature는 반드시 수치형 데이터만 될 수 있다.[cite: 1]",
            "Label은 분류 문제에서는 카테고리, 회귀 문제에서는 수치값이 될 수 있다.[cite: 1]"
        ],
        answer: 3,
        concept: "Feature(특성)는 모델 예측에 사용되는 설명 변수이며, Label(라벨)은 맞추고자 하는 정답이다[cite: 1, 3].",
        solution: "Feature는 수치형 데이터뿐만 아니라 범주형, 텍스트, 이미지, 음성 등 다양한 형태가 가능하다[cite: 1].",
        why: "④번의 '반드시 수치형 데이터만 될 수 있다'는 설명은 틀린 설명이다[cite: 1].",
        examPoint: "Feature의 다양한 데이터 타입 가능성과 분류/회귀에 따른 Label의 형태 차이를 파악할 것[cite: 1].",
        wrongPoints: "①, ②, ③, ⑤는 모두 Feature와 Label의 올바른 정의 및 특징이다[cite: 1]."

    {
        id: 3,
        question: "Q3. 미지의 참 함수 f(X)를 학습하는 이유로 적절하지 않은 것은?[cite: 1]",

            "Feature(X) 값의 변화에 따라서 Label(Y)이 어떻게 변화하는지 알기 위해[cite: 1]"
        ],
        answer: 1,
        concept: "데이터는 '참 함수 f(X) + 측정오차'로 구성되며, 모델 학습의 목표는 미지의 참 함수 f(X)를 근사하는 것이다[cite: 1, 3].",
        solution: "측정 오차(noise)는 관측 기계 한계나 환경 요인 등으로 발생하는 것이므로, f(X)를 잘 학습한다고 해서 데이터 자체에 포함된 측정 오차를 제거할 수는 없다[cite: 1, 3].",
        why: "학습의 목적은 예측, 중요 특성 파악, 해석 가능성이며 측정오차 자체의 제거는 불가능하다[cite: 1, 3].",
        examPoint: "학습을 통해 오차를 완벽히 0으로 만들거나 측정 오차 자체를 제거할 수 없다는 점에 유의할 것[cite: 1, 3].",
        wrongPoints: "①, ③, ④, ⑤는 f(X) 학습의 3대 목적(예측, 중요 특성 파악, 해석 가능성)에 해당하는 올바른 설명이다[cite: 1, 3]."
    },
    {
        id: 4,
        question: "Q4. 지도학습(Supervised Learning)에 대한 설명으로 옳은 것은?[cite: 1]",
        options: [
            "입력 데이터만 있고 정답(라벨)이 없는 데이터로 학습한다.[cite: 1]",

// App State Management
let appState = {
    mode: 'study', // 'study' | 'exam'
    currentIndex: 0,
    userAnswers: new Array(questionsData.length).fill(null), // { selected: number, status: 'correct'|'incorrect'|'revealed' }
};

// DOM References
const screens = {
    start: document.getElementById('start-screen'),
    quiz: document.getElementById('quiz-screen'),
    result: document.getElementById('result-screen')
};

function showScreen(screenKey) {
    Object.keys(screens).forEach(key => {
        screens[key].classList.remove('active');
    });
    screens[screenKey].classList.add('active');
}

function startApp(mode) {
    appState.mode = mode;
    appState.currentIndex = 0;
    appState.userAnswers = new Array(questionsData.length).fill(null);
    showScreen('quiz');
    renderQuiz();
}

function renderQuiz() {
    const q = questionsData[appState.currentIndex];
    const userAns = appState.userAnswers[appState.currentIndex];

    // Update Header Stats
    document.getElementById('stat-current').innerText = `${q.id} / ${questionsData.length}`;
    
    let correctCount = 0;
    let incorrectCount = 0;
    let answeredCount = 0;

    appState.userAnswers.forEach(ans => {
        if (ans) {
            answeredCount++;
            if (ans.status === 'correct') correctCount++;
            if (ans.status === 'incorrect') incorrectCount++;
        }
    });

    const progressPercent = Math.round((answeredCount / questionsData.length) * 100);
    document.getElementById('stat-progress').innerText = `${progressPercent}%`;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
    document.getElementById('stat-correct').innerText = correctCount;
    document.getElementById('stat-incorrect').innerText = incorrectCount;
    document.getElementById('stat-unanswered').innerText = questionsData.length - answeredCount;

    // Render Matrix Nav
    const navMatrix = document.getElementById('nav-matrix');
    navMatrix.innerHTML = '';
    questionsData.forEach((item, idx) => {
        const navBtn = document.createElement('div');
        navBtn.className = 'nav-item';
        if (idx === appState.currentIndex) navBtn.classList.add('active');
        
        const ans = appState.userAnswers[idx];
        if (ans) {
            navBtn.classList.add(ans.status);
        } else {
            navBtn.classList.add('unanswered');
        }
        navBtn.innerText = item.id;
        navBtn.onclick = () => {
            appState.currentIndex = idx;
            renderQuiz();
        };
        navMatrix.appendChild(navBtn);
    });

    // Render Question Title
    document.getElementById('q-title').innerText = `${q.id}. ${q.question}`;

    // Render Options
    const optionsContainer = document.getElementById('q-options');
    optionsContainer.innerHTML = '';
    
    q.options.forEach((optText, optIdx) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'quiz-option';
        radio.value = optIdx;
        radio.id = `opt-${optIdx}`;

        if (userAns && userAns.selected === optIdx) {
            radio.checked = true;
        }

        const label = document.createElement('label');
        label.htmlFor = `opt-${optIdx}`;
        label.style.width = '100%';
        label.style.cursor = 'pointer';
        label.innerText = optText;

        li.appendChild(radio);
        li.appendChild(label);

        // Feedback Styles if submitted or revealed
        if (userAns) {
            radio.disabled = true;
            if (optIdx === q.answer) {
                li.classList.add('correct-bg');
                const badge = document.createElement('span');
                badge.className = 'feedback-badge';
                badge.innerText = '✓ 정답';
                li.appendChild(badge);
            }
            if (userAns.selected === optIdx && userAns.selected !== q.answer) {
                li.classList.add('incorrect-bg');
                const badge = document.createElement('span');
                badge.className = 'feedback-badge';
                badge.innerText = '✗ 내가 선택한 답';
                li.appendChild(badge);
            }
        }

        optionsContainer.appendChild(li);
    });

    // Buttons Visibility
    const btnSubmit = document.getElementById('btn-submit');
    const btnReveal = document.getElementById('btn-reveal');
    const btnExplain = document.getElementById('btn-explain');
    const feedbackMsg = document.getElementById('feedback-message');
    const explanationBox = document.getElementById('explanation-box');

    if (appState.mode === 'exam') {
        btnReveal.style.display = 'none';
        btnExplain.style.display = 'none';
        explanationBox.classList.remove('active');
        if (userAns) {
            btnSubmit.disabled = true;
            feedbackMsg.style.display = 'block';
            feedbackMsg.innerText = '답안이 제출되었습니다.';
            feedbackMsg.style.color = 'var(--text-muted)';
        } else {
            btnSubmit.disabled = false;
            feedbackMsg.style.display = 'none';
        }
    } else {
        // Study Mode
        btnReveal.style.display = 'inline-flex';
        btnExplain.style.display = 'inline-flex';

        if (userAns) {
            btnSubmit.disabled = true;
            feedbackMsg.style.display = 'block';
            if (userAns.status === 'correct') {
                feedbackMsg.innerText = '🎉 정답입니다!';
                feedbackMsg.style.color = 'var(--success)';
            } else if (userAns.status === 'incorrect') {
                feedbackMsg.innerText = '❌ 오답입니다.';
                feedbackMsg.style.color = 'var(--danger)';
            } else {
                feedbackMsg.innerText = '🟡 정답을 확인한 문제입니다.';
                feedbackMsg.style.color = 'var(--warning)';
            }
        } else {
            btnSubmit.disabled = false;
            feedbackMsg.style.display = 'none';
            explanationBox.classList.remove('active');
        }
    }

    // Previous / Next Buttons
    document.getElementById('btn-prev').disabled = (appState.currentIndex === 0);
    
    const btnNext = document.getElementById('btn-next');
    if (appState.currentIndex === questionsData.length - 1) {
        btnNext.innerText = '최종 제출 및 결과 보기';
    } else {
        btnNext.innerText = '다음 문제 →';
    }

    // Fill Explanation Data
    document.getElementById('exp-answer').innerText = `${q.answer + 1}번: ${q.options[q.answer]}`;
    document.getElementById('exp-concept').innerText = q.concept;
    document.getElementById('exp-solution').innerText = q.solution;
    document.getElementById('exp-why').innerText = q.why;
    document.getElementById('exp-point').innerText = q.examPoint;
    
    const wrongContainer = document.getElementById('exp-wrong-container');
    if (q.wrongPoints) {
        wrongContainer.style.display = 'block';
        document.getElementById('exp-wrong').innerText = q.wrongPoints;
    } else {
        wrongContainer.style.display = 'none';
    }
}

function submitAnswer() {
    const selectedOpt = document.querySelector('input[name="quiz-option"]:checked');
    if (!selectedOpt) {
        alert('답을 선택해주세요!');
        return;
    }

    const selectedIndex = parseInt(selectedOpt.value);
    const q = questionsData[appState.currentIndex];
    const isCorrect = (selectedIndex === q.answer);

    appState.userAnswers[appState.currentIndex] = {
        selected: selectedIndex,
        status: isCorrect ? 'correct' : 'incorrect'
    };

    if (appState.mode === 'study') {
        document.getElementById('explanation-box').classList.add('active');
    }

    renderQuiz();
}

function revealAnswer() {
    const q = questionsData[appState.currentIndex];
    if (!appState.userAnswers[appState.currentIndex]) {
        appState.userAnswers[appState.currentIndex] = {
            selected: null,
            status: 'revealed'
        };
    }
    document.getElementById('explanation-box').classList.add('active');
    renderQuiz();
}

function toggleExplanation() {
    const box = document.getElementById('explanation-box');
    box.classList.toggle('active');
}

function prevQuestion() {
    if (appState.currentIndex > 0) {
        appState.currentIndex--;
        renderQuiz();
    }
}

function nextQuestion() {
    if (appState.currentIndex < questionsData.length - 1) {
        appState.currentIndex++;
        renderQuiz();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    let correctCount = 0;
    let incorrectCount = 0;
    let unansweredCount = 0;

    appState.userAnswers.forEach(ans => {
        if (!ans) {
            unansweredCount++;
        } else if (ans.status === 'correct') {
            correctCount++;
        } else {
            incorrectCount++;
        }
    });

    const total = questionsData.length;
    const score = Math.round((correctCount / total) * 100);

    document.getElementById('res-score').innerText = `${score}점`;
    document.getElementById('res-rate').innerText = `${score}%`;
    document.getElementById('res-correct').innerText = correctCount;
    document.getElementById('res-incorrect').innerText = incorrectCount;
    document.getElementById('res-unanswered').innerText = unansweredCount;

    showScreen('result');
}

function restartApp(filter) {
    if (filter === 'all') {
        startApp(appState.mode);
    } else if (filter === 'wrong') {
        // Keep only wrong questions or reset unanswered
        appState.currentIndex = 0;
        appState.userAnswers = appState.userAnswers.map(ans => {
            return (ans && ans.status === 'incorrect') ? null : ans;
        });
        showScreen('quiz');
        renderQuiz();
    }
}

function switchToReview() {
    appState.mode = 'study';
    appState.currentIndex = 0;
    showScreen('quiz');
    renderQuiz();
}
</script>
